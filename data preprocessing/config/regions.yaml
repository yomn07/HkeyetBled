# Gazetteer des 24 gouvernorats tunisiens.
# - macro : région économique officielle (7 régions)
# - aliases_fr : villes, sites et lieux-dits (FR/EN/translittérations) -> gouvernorat
# - aliases_ar : idem en arabe
# La correspondance est insensible aux accents et à la casse (côté latin)
# et tolère les préfixes arabes (و، ب، ل، ف، ك، ال).
# NB : "تونس" seul est volontairement absent (ambigu : Tunis / Tunisie), de même que les
# noms qui sont aussi des mots courants (الرياض jardins, مساكن maisons, القطار train, جمال beauté…).

