# =====================================================================
# Sources du corpus Hkeyet Bled (Lot 1)
# Chaque source déclare sa licence et si son texte peut être redistribué.
#  - redistributable: true  -> le texte complet va dans corpus_public.jsonl
#  - redistributable: false -> on garde le texte pour l'index local (usage
#    pédagogique, avec citation) mais on ne livre publiquement que les liens.
# =====================================================================

http:
  # Wikimedia exige un User-Agent identifiable avec un contact.
  # >>> Remplacez l'adresse par celle de l'équipe avant de lancer la collecte.
  user_agent: "HkeyetBledRAG/1.0 (projet etudiant NLP; contact: votre.email@exemple.tn) python-requests"
  delay_seconds: 1.0        # pause entre deux requêtes vers un même site
  timeout: 30
  max_retries: 3

# ---------------------------------------------------------------------
# 1) Wikipédia (FR comme pivot ; AR et EN récupérés via les liens interlangues)
# ---------------------------------------------------------------------
wikipedia:
