# ---------------------------------------------------------------------
# 2) Wikivoyage : très utile pour les itinéraires (quoi voir / manger / faire)
# ---------------------------------------------------------------------
wikivoyage:
  license: "CC BY-SA 4.0"
  redistributable: true
  source_type: guide_voyage
  langs: [fr, en]
  pages: [Tunisie, Tunis, Carthage, Sidi Bou Saïd, Kairouan, Sousse, Monastir, Mahdia, El Jem,
          Sfax, Djerba, Tozeur, Nefta, Douz, Matmata, Tataouine, Tabarka, Bizerte, Hammamet,
          Nabeul, Dougga, Le Kef, Gabès, Kerkennah, Ain Draham, Kébili, Gafsa, Zaghouan, Béja,
          Guide de conversation arabe tunisien]
  # Titres EN quand ils diffèrent du FR
  en_titles: {Tunisie: Tunisia, Sidi Bou Saïd: Sidi Bou Said, Gabès: Gabes, Kébili: Kebili,
              Béja: Beja, Kerkennah: Kerkennah Islands, Ain Draham: Ain Draham,
              Guide de conversation arabe tunisien: Tunisian Arabic phrasebook}

# ---------------------------------------------------------------------
# 2 bis) Fiches rédigées par l'équipe (config/manual/*.md) : expressions,
#        proverbes, savoir-vivre… Lues hors-ligne à chaque `collect`.
# ---------------------------------------------------------------------
manual:
  license: "CC BY 4.0 – rédigé et vérifié par l'équipe Hkeyet Bled"
  redistributable: true
  source_type: equipe

# ---------------------------------------------------------------------
# 3) Sites web officiels et culturels (scraping respectueux de robots.txt)
#    -> vérifiez les URL dans un navigateur avant la collecte : les sites
#       institutionnels tunisiens changent souvent d'adresse.
# ---------------------------------------------------------------------
web:
  - name: unesco_whc
    label: UNESCO – Centre du patrimoine mondial (fiches des biens tunisiens)
    source_type: officiel
    license: "© UNESCO – réutilisation non commerciale avec citation (vérifier les conditions)"
    redistributable: false
    urls:
      - https://whc.unesco.org/fr/list/36     # Médina de Tunis
      - https://whc.unesco.org/fr/list/37     # Site archéologique de Carthage
      - https://whc.unesco.org/fr/list/38     # Amphithéâtre d'El Jem
      - https://whc.unesco.org/fr/list/8      # Parc national de l'Ichkeul
      - https://whc.unesco.org/fr/list/332    # Cité punique de Kerkouane
      - https://whc.unesco.org/fr/list/498    # Médina de Sousse
      - https://whc.unesco.org/fr/list/499    # Kairouan
      - https://whc.unesco.org/fr/list/794    # Dougga / Thugga
      - https://whc.unesco.org/fr/list/1640   # Djerba

  - name: inp
    label: Institut National du Patrimoine (INP)
    source_type: officiel
    license: "© INP – tous droits réservés (usage pédagogique avec citation)"
    redistributable: false
    crawl:
      start_urls:
        - https://www.inp2020.tn/en/category/non-classe/_monuments_sites/
        - https://www.inp2020.tn/en/category/_monuments_sites/page/2/
        - https://www.inp2020.tn/en/category/_monuments_sites/page/3/
      link_pattern: 'inp2020\.tn/(en|fr|ar)/(\?p=\d+|[^/?#]+/?$)'
      exclude_pattern: '/(category|tag|author|page|wp-|feed)'
      max_pages: 60
    urls:
      - https://inp.rnrt.tn/en/?p=1008

  - name: ontt
    label: Office National du Tourisme Tunisien – brochures Discover Tunisia
    source_type: officiel
    license: "© ONTT – tous droits réservés (usage pédagogique avec citation)"
    redistributable: false
    urls:
      - https://brochures.discovertunisia.com/Catalogue_ontt_Culture/img/catalogue-Culture.pdf
      - https://brochures.discovertunisia.com/Catalogue_ontt_Nature/img/catalogue-Nature.pdf
      - https://brochures.discovertunisia.com/Catalogue_ontt_Rando/img/catalogue-Rando.pdf
      - https://www.discovertunisia.com/sites/default/files/gastronomie_tunisie.pdf   # gastronomie par région

  - name: blogs
    label: Blogs et magazines culturels
    source_type: blog
    license: "© auteurs respectifs – usage pédagogique avec citation"
    redistributable: false
    urls:
      - https://linstant-m.tn/single-article/ar9398_crafting-heritage-the-artisanal-trades-of-tunisia-worth-preserving
      - https://linstant-m.tn/single-article/ar9805_a-journey-through-tunisias-8-most-iconic-traditional-crafts
      # >>> Ajoutez ici d'autres articles (un par ligne) : gastronomie, fêtes, artisanat régional…
      # artisanat régional
      - https://lepetitjournal.com/tunis/a-voir-a-faire/artisanat-tunisien-sejnane-et-mahdia-la-parite-nexiste-pas-53821
